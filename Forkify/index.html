<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Edu+VIC+WA+NT+Hand:wght@400..700&family=Epunda+Slab:ital,wght@0,300..900;1,300..900&family=Yuyu&display=swap"

</head>

<body class="bg-body-tertiary ">
    <main class="container py-5">
        <h1 class="text-center mb-5 fw-bold text-warning">
            Recipe Finder
        </h1>

        <div class="row g-3 justify-content-center mb-5">
            <div class="col-lg-6">
                <input type="search" id="searchInput" class="form-control form-control-lg shadow-sm border-warning"
                    placeholder="Search for recipes...">
            </div>

            <div class="col-lg-3">
                <select id="RecipeSelect" class="form-select form-select-lg shadow-sm border-warning ">
                    <option selected disabled>Select</option>
                </select>
            </div>
        </div>

        <div class="row g-4" id="cardData">


        </div>
    </main>
    <footer class="text-center text-warning pt-3">
        <p>© 2026 All Rights Reserved By Recipes</p>
        <p>© Distributed By Recipes</p>
    </footer>

    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/main.js"></script>
</body>

</html>
